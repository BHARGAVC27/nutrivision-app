plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// NOTE: the Kotlin plugin is deliberately NOT applied here.
// `expo-module-gradle-plugin` configures Kotlin for us using the versions the
// host app already resolved. Applying `org.jetbrains.kotlin.android` on top of
// it fails under AGP 9 with "Cannot add extension with name 'kotlin'".
// See docs/ANDROID_APP_BRIEF.md §10.1.

group = 'com.nutrivision.vision'
version = '0.1.0'

android {
  namespace 'com.nutrivision.vision'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Pinned deliberately. 0.10.29 is the most recent MediaPipe release that
  // still ships an x86_64 JNI library, which the standard Android emulator
  // image requires; 0.10.26.1 dropped x86 and 0.10.35's AAR has no JNI at all.
  // Wrong version => UnsatisfiedLinkError on every emulator.
  // See docs/ANDROID_APP_BRIEF.md §10.2.
  implementation 'com.google.mediapipe:tasks-vision:0.10.29'

  // Reads EXIF orientation off the captured still so pose landmarks land in
  // the same coordinate frame the user actually saw.
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
